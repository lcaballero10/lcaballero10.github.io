services:
  jekyll-site:
    image: jekyll-site
    build: .
    volumes: [ .:/usr/src/app ]
    ports: [ 4000:4000, 35729:35729 ]
    user: 1000:1000
    environment: [ JEKYLL_ENV=docker ]
    # Run `bundle install` first so the installed gems always match the
    # mounted Gemfile.lock (it is gitignored and can drift from the image).
    command: sh -c "bundle install && bundle exec jekyll serve -H 0.0.0.0 -w --livereload --force_polling --config _config.yml,_config_docker.yml"
